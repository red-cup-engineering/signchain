name: SignChain original source and pinned package conformance
on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/signchain-native-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/signchain-native-conformance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.20.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Admit exact existing workspace dependency closure
        run: pnpm install --frozen-lockfile
      - name: Check original source revision and indexed temporal evidence
        run: pnpm exec node --test test/source-withdrawal.test.mjs test/log.test.mjs test/telling-source.test.mjs
      - name: Verify entire original SignChain test and source receiving suite
        run: pnpm test
