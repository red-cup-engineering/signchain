name: SignChain native conformance
on:
  pull_request:
    paths:
      - '.github/workflows/signchain-native.yml'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
  push:
    branches: [main]
    paths:
      - '.github/workflows/signchain-native.yml'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signchain-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install suppliers from the committed pnpm lock and the Group registry
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run the native test suite
        run: pnpm test
      - name: Inspect package publication contents
        run: npm pack --dry-run --json
