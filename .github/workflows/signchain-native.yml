name: SignChain native
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signchain-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_NPM_REGISTRY: https://registry.561.group/
      npm_config_registry: https://registry.561.group/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install suppliers from the Group registry
        run: |
          set -euo pipefail
          shared_store="${PNPM_STORE_DIR:-${PNPM_HOME:-${XDG_DATA_HOME:-$HOME/.local/share}/pnpm}/store}"
          mkdir -p -- "$shared_store"
          store_mode="$(stat -c %a -- "$shared_store")"
          umask "$(printf '%03o' "$((0777 & ~0$store_mode))")"
          corepack pnpm@11.28.5 install --ignore-scripts --registry=https://registry.561.group/ \
            --config.registry=https://registry.561.group/ --store-dir="$shared_store" \
            --config.enable-global-virtual-store=true --config.package-import-method=hardlink
      - name: Check source syntax
        run: find src -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - run: corepack pnpm@11.28.5 test
      - name: Run the shipped receiving test in a clean consumer
        run: |
          consumer=$(mktemp -d)
          trap 'rm -rf "$consumer"' EXIT
          archive=$(npm pack --silent --ignore-scripts --pack-destination "$consumer")
          cd "$consumer"
          npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.561.group/ "./$archive"
          node --test "$consumer/node_modules/@red-cup-engineering/signchain/test/receiving.test.mjs"
